<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Night - simulated Alexa+</title>
<style>
  :root { --bg:#05080f; --fg:#e8f1ff; --dim:#7d8aa5; --c1:#00d4ff; --c2:#2a6bff; --card:#0e1626; }
  * { box-sizing: border-box; }
  html, body { height: 100vh; height: 100dvh; margin: 0; }
  body { background: radial-gradient(ellipse at 50% 20%, #0b1630 0%, var(--bg) 60%); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; }
  header { padding: 14px 16px 0; font-weight: 600; letter-spacing: .04em; color: var(--dim); display:flex; gap:12px; align-items:center; }
  header button { background: none; border: 1px solid #25314b; color: var(--dim); border-radius: 14px; padding: 2px 10px; cursor: pointer; font-size: 13px; }
  .ringwrap { margin: 18px 0 6px; width: 150px; height: 150px; position: relative; flex: none; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 7px solid var(--c1);
    box-shadow: 0 0 24px var(--c1), 0 0 60px var(--c2), inset 0 0 24px var(--c2); transition: all .4s; }
  .idle .ring { opacity: .45; animation: breathe 4s ease-in-out infinite; }
  .listening .ring { animation: pulse 1s ease-in-out infinite; border-color: #5cf0ff; }
  .thinking .ring { border-color: transparent; border-top-color: var(--c1); border-right-color: var(--c2);
    animation: spin 1s linear infinite; }
  .speaking .ring { animation: speak .5s ease-in-out infinite alternate; }
  @keyframes breathe { 50% { opacity: .75; transform: scale(1.03);} }
  @keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 40px var(--c1), 0 0 90px var(--c2), inset 0 0 30px var(--c2);} }
  @keyframes spin { to { transform: rotate(360deg);} }
  @keyframes speak { from { transform: scale(.97); filter: brightness(.9);} to { transform: scale(1.1); filter: brightness(1.4);} }
  #state { color: var(--dim); font-size: 13px; height: 18px; }
  #log { flex: 1; width: 100%; max-width: 640px; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; background: var(--card); word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #16376b; }
  .msg.bot { align-self: flex-start; border: 1px solid #1c2a47; }
  details { margin-top: 6px; font-size: 12px; color: var(--c1); font-family: ui-monospace, Menlo, monospace; }
  details summary { cursor: pointer; opacity: .85; }
  details div { color: var(--dim); margin-top: 3px; white-space: pre-wrap; }
  form { width: 100%; max-width: 640px; display: flex; gap: 8px; padding: 8px 16px; align-items: center; }
  #text { flex: 1; min-width: 0; background: var(--card); border: 1px solid #25314b; color: var(--fg); border-radius: 22px; padding: 11px 16px; font-size: 16px; outline: none; }
  #text:focus { border-color: var(--c1); }
  .btn { flex: none; border: 0; border-radius: 50%; width: 46px; height: 46px; cursor: pointer; color: #fff; font-size: 20px; background: #1b2744; }
  #mic { width: 64px; height: 64px; font-size: 28px; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 0 20px var(--c2); }
  #mic.on { background: #ff3b6b; box-shadow: 0 0 24px #ff3b6b; }
  footer { padding: 4px 16px calc(10px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<header>Game Night - simulated Alexa+ <button id="mute" type="button">Voice on</button></header>
<div class="ringwrap idle" id="ring"><div class="ring"></div></div>
<div id="state">Tap the mic or type</div>
<div id="log" role="log" aria-live="polite"></div>
<form id="form" autocomplete="off">
  <button class="btn" id="mic" type="button" title="Talk" aria-label="Speak">&#127908;</button>
  <input id="text" placeholder="Say or type something..." aria-label="Message">
  <button class="btn" type="submit" title="Send" aria-label="Send">&#10148;</button>
</form>
<footer>Connected to the Game Night MCP server over Streamable HTTP</footer>
<script>
// Optional GAME_NIGHT_TOKEN from the URL fragment (#token=...): kept in memory only, never sent in the URL.
const TOKEN = new URLSearchParams(location.hash.slice(1)).get('token');
if (TOKEN) history.replaceState(null, '', location.pathname);
const $ = (id) => document.getElementById(id);
const conversation = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
const ring = $('ring'), logEl = $('log'), stateEl = $('state'), mic = $('mic'), input = $('text');
const LABEL = { idle: 'Tap the mic or type', listening: 'Listening...', thinking: 'Thinking...', speaking: 'Speaking...' };
let muted = false, rec = null, listening = false;

function setState(s) { ring.className = 'ringwrap ' + s; stateEl.textContent = LABEL[s]; }

function add(who, text, tools) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  if (tools && tools.length) {
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = 'MCP: ' + tools.map((t) => t.name + ' ' + JSON.stringify(t.args)).join(' | ');
    det.appendChild(sum);
    for (const t of tools) {
      const r = document.createElement('div');
      r.textContent = t.name + ' -> ' + t.result;
      det.appendChild(r);
    }
    d.appendChild(det);
  }
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

function pickVoice() {
  const vs = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
  return vs.find((v) => /samantha|aria|jenny|google us english|female/i.test(v.name)) || vs[0];
}
function stopSpeaking() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
function speak(text) {
  if (muted || !('speechSynthesis' in window)) { setState('idle'); return; }
  stopSpeaking();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v; u.lang = (v && v.lang) || 'en-US';
  u.onstart = () => setState('speaking');
  u.onend = u.onerror = () => { if (!listening) setState('idle'); };
  speechSynthesis.speak(u);
}

let busy = false;
function setBusy(b) { busy = b; input.disabled = b; if (!b) input.focus(); }
const SORRY = "Sorry, I couldn't reach Game Night.";
async function send(text) {
  text = text.trim(); if (!text || busy) return;
  setBusy(true);
  try {
    stopSpeaking();
    add('user', text);
    setState('thinking');
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json', ...(TOKEN ? { authorization: 'Bearer ' + TOKEN } : {}) }, body: JSON.stringify({ conversation, text }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    add('bot', data.reply, data.tools);
    try { speak(data.reply); } catch (e) { setState('idle'); }
  } catch (e) {
    add('bot', SORRY);
    try { speak(SORRY); } catch (e2) { setState('idle'); }
  } finally {
    setBusy(false);
  }
}

$('form').addEventListener('submit', (e) => { e.preventDefault(); const t = input.value; input.value = ''; send(t); });
$('mute').onclick = () => { muted = !muted; $('mute').textContent = muted ? 'Voice off' : 'Voice on'; if (muted) { stopSpeaking(); setState('idle'); } };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
  let final = '';
  rec.onstart = () => { listening = true; final = ''; mic.classList.add('on'); setState('listening'); };
  rec.onresult = (e) => {
    let interim = ''; final = '';
    for (const r of e.results) (r.isFinal ? (final += r[0].transcript) : (interim += r[0].transcript));
    input.value = final || interim;
  };
  rec.onerror = (e) => { listening = false; mic.classList.remove('on'); setState('idle'); stateEl.textContent = (e.error === 'no-speech' || e.error === 'aborted') ? 'Did not catch that, try again' : 'Mic blocked, type instead'; };
  rec.onend = () => {
    listening = false; mic.classList.remove('on');
    const t = final || input.value; input.value = '';
    if (t.trim()) send(t); else if (ring.classList.contains('listening')) setState('idle');
  };
}
let primed = false;
document.addEventListener('pointerdown', () => {
  if (primed || !('speechSynthesis' in window)) return;
  primed = true;
  const u = new SpeechSynthesisUtterance(''); u.volume = 0; speechSynthesis.speak(u);
}, { once: true });
mic.onclick = () => {
  stopSpeaking();
  if (!rec) { input.focus(); stateEl.textContent = 'Speech input not supported here - type instead'; return; }
  if (listening) { rec.stop(); return; }
  try { rec.start(); } catch (e) {}
};
</script>
</body>
</html>
